name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, zero runtime deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run test suite (python -S, pure stdlib)
        run: python -S -m unittest discover -s tests -p "test_*.py"

      - name: Offline pipeline smoke (--offline)
        run: python -S -m benchmark.run --offline
