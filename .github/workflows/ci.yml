name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable, zero runtime deps)
        # dependencies = [] in pyproject; this only installs the `benchmark`
        # package so the test suite can `from benchmark.verify import ...`.
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run test suite (unittest, stdlib-only)
        # NOTE: do NOT use `python -S` here. The editable install lands in
        # site-packages; `-S` would hide it and every `import benchmark.*`
        # would fail with ModuleNotFoundError.
        run: python -m unittest discover -s tests -v

      - name: Offline pipeline smoke (score committed answers, no API)
        # `--offline` runs the verifier with zero API calls; `--input
        # demo/answers.jsonl` scores the committed demo model answers (skips
        # the SAMPLE-mode guard that refuses to clobber real reports). Exercises
        # extract/verify/score/pipeline end-to-end. NOTE: the root-level
        # answers.jsonl is git-ignored (per-user real-model output), so the
        # smoke must use the tracked demo fixture instead.
        run: python -m benchmark.run --offline --input demo/answers.jsonl
