[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-hallucination-bench"
version = "1.0.0"
description = "Chinese legal citation hallucination benchmark: expert-verified knowledge base + 100% precise binary (verbatim-or-zero) content evaluator + zero-tolerance repealed-law trap. Offline-first, zero runtime dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = [
    "legal",
    "benchmark",
    "hallucination",
    "llm-evaluation",
    "chinese-law",
    "nlp",
]
dependencies = []

[project.scripts]
lhb = "benchmark.run:main"

[project.optional-dependencies]
dev = ["build", "twine"]

[tool.setuptools.packages.find]
namespaces = true
exclude = ["tests*"]
